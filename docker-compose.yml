services:
  # etcd for APISIX configuration storage
  etcd:
    image: bitnami/etcd:3.5.0
    container_name: etcd
    restart: unless-stopped
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    networks:
      - apisix-network

  # APISIX API Gateway - Minimal Configuration
  apisix:
    image: apache/apisix:3.9.1-debian
    container_name: apisix
    restart: unless-stopped
    depends_on:
      - etcd
    ports:
      - "9080:9080"
      - "9180:9180"
    networks:
      - apisix-network
    volumes:
      - ./apisix-custom.yaml:/usr/local/apisix/conf/config.yaml:ro
    
  # MariaDB Database
  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: apisix_db
      MYSQL_USER: apisix_user
      MYSQL_PASSWORD: apisix_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - apisix-network

  # WordPress API Provider
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: apisix_user
      WORDPRESS_DB_PASSWORD: apisix_pass
      WORDPRESS_DB_NAME: apisix_db
      WORDPRESS_TABLE_PREFIX: wp_
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - apisix-network

  # GoFiber Backend
  gofiber-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: gofiber-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: apisix_user
      DB_PASSWORD: apisix_pass
      DB_NAME: apisix_db
      PORT: 3000
      ENVIRONMENT: production
    ports:
      - "3000:3000"
    depends_on:
      - mariadb
    networks:
      - apisix-network

  # React Dashboard
  apisix-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apisix-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_APISIX_ADMIN_URL=http://localhost:9180
    depends_on:
      - apisix
    networks:
      - apisix-network

networks:
  apisix-network:
    driver: bridge

volumes:
  mariadb_data:
  wordpress_data: