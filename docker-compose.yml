version: '3.9'

services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: apisix_db
      MYSQL_USER: apisix_user
      MYSQL_PASSWORD: apisix_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gateway-net

  gofiber-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gofiber-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: apisix_user
      DB_PASSWORD: apisix_pass
      DB_NAME: apisix_db
      PORT: 3000
      ENVIRONMENT: production
      DEBUG: false
      ENABLE_SAMPLE_DATA: true
    ports:
      - "3000:3000"
    depends_on:
      - mariadb
    networks:
      - gateway-net

  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: apisix_user
      WORDPRESS_DB_PASSWORD: apisix_pass
      WORDPRESS_DB_NAME: apisix_db
      WORDPRESS_TABLE_PREFIX: wp_
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - gateway-net

  apisix_api:
    image: apache/apisix:3.9.1-debian
    container_name: apisix_api
    ports:
      - "9080:9080"
      - "9180:9180"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    environment:
      - APISIX_STAND_ALONE=true
    restart: unless-stopped
    command: >
      sh -c "
        echo '=== APISIX Standalone Setup ===' &&
        echo 'Waiting for backends (30s)...' &&
        sleep 30 &&
        echo 'Checking config files...' &&
        ls -la /usr/local/apisix/conf/ &&
        echo 'Config content:' &&
        cat /usr/local/apisix/conf/config.yaml &&
        echo 'Routes content:' &&
        cat /usr/local/apisix/conf/apisix.yaml &&
        echo 'Starting APISIX...' &&
        /usr/bin/apisix init &&
        /usr/bin/apisix start &&
        echo 'APISIX started successfully!' &&
        tail -f /usr/local/apisix/logs/error.log
      "
    networks:
      - gateway-net
    depends_on:
      - gofiber-backend
      - wordpress

  apisix-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apisix-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    depends_on:
      - apisix_api
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  mariadb_data:
  wordpress_data: