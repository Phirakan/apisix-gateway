version: '3.9'

services:
  etcd:
    image: bitnami/etcd:3.5.0
    container_name: etcd
    ports:
      - "2379:2379"
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    networks:
      - gateway-net

  apisix_api:
    image: apache/apisix:3.9.1-debian
    container_name: apisix_api
    ports:
      - "9080:9080"
      - "9180:9180"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9180/apisix/admin/routes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - gateway-net

  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: apisix_db
      MYSQL_USER: apisix_user
      MYSQL_PASSWORD: apisix_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: apisix_user
      WORDPRESS_DB_PASSWORD: apisix_pass
      WORDPRESS_DB_NAME: apisix_db
      WORDPRESS_TABLE_PREFIX: wp_
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-json/wp/v2"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gofiber-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gofiber-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: apisix_user
      DB_PASSWORD: apisix_pass
      DB_NAME: apisix_db
      PORT: 3000
      ENVIRONMENT: production
      DEBUG: false
    ports:
      - "3000:3000"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  apisix-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apisix-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_APISIX_ADMIN_URL=http://localhost:9180
      - VITE_APISIX_GATEWAY_URL=http://localhost:9080
    depends_on:
      apisix_api:
        condition: service_healthy
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  mariadb_data:
  wordpress_data:
