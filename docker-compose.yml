version: '3.9'

services:
  apisix_api:
    image: apache/apisix:3.9.1-debian
    container_name: apisix_api
    ports:
      - "9080:9080"
      - "9180:9180"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - apisix_config_volume:/usr/local/apisix/conf  # ใช้ named volume แทน bind mount
    environment:
      - APISIX_STAND_ALONE=true
    restart: unless-stopped
    command: >
      sh -c "
        echo '=== APISIX Standalone Setup with Dynamic Route Management ===' &&
        echo 'Copying initial config...' &&
        cp /usr/local/apisix/conf/config.yaml /usr/local/apisix/conf/config.yaml.bak &&
        echo 'Setting up apisix.yaml...' &&
        if [ ! -f /usr/local/apisix/conf/apisix.yaml ]; then
          echo 'Creating initial apisix.yaml...' &&
          cat > /usr/local/apisix/conf/apisix.yaml << 'EOF'
      routes: []
      upstreams: []
      EOF
        else
          echo 'Using existing apisix.yaml...' &&
          cp /usr/local/apisix/conf/apisix.yaml /usr/local/apisix/conf/apisix.yaml.bak
        fi &&
        chmod 666 /usr/local/apisix/conf/apisix.yaml &&
        echo 'Waiting for backends (45s)...' &&
        sleep 45 &&
        echo 'Starting APISIX...' &&
        /usr/bin/apisix init &&
        /usr/bin/apisix start &&
        echo 'APISIX started successfully!' &&
        echo 'Testing internal connectivity...' &&
        sleep 5 &&
        curl -s http://gofiber-backend:3000/api/health || echo 'GoFiber not ready yet' &&
        curl -s http://wordpress/wp-json/wp/v2/posts || echo 'WordPress not ready yet' &&
        echo 'APISIX is ready for dynamic route management!' &&
        echo 'Dashboard available at: http://localhost:5173' &&
        echo 'Gateway available at: http://localhost:9080' &&
        tail -f /usr/local/apisix/logs/error.log
      "
    networks:
      - gateway-net
    depends_on:
      wordpress:
        condition: service_healthy
      gofiber-backend:
        condition: service_healthy

  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: apisix_db
      MYSQL_USER: apisix_user
      MYSQL_PASSWORD: apisix_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: apisix_user
      WORDPRESS_DB_PASSWORD: apisix_pass
      WORDPRESS_DB_NAME: apisix_db
      WORDPRESS_TABLE_PREFIX: wp_
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  gofiber-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gofiber-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: apisix_user
      DB_PASSWORD: apisix_pass
      DB_NAME: apisix_db
      PORT: 3000
      ENVIRONMENT: production
      DEBUG: false
      ENABLE_CORS: true
      ROUTE_CONFIG_PATH: /shared/apisix.yaml
    ports:
      - "3000:3000"
    volumes:
      - apisix_config_volume:/shared  # ใช้ shared volume กับ APISIX
      - route_backups:/app/backups    # Volume สำหรับ backups
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Service สำหรับ sync config ระหว่าง containers
  config-sync:
    image: alpine:latest
    container_name: config-sync
    restart: unless-stopped
    volumes:
      - apisix_config_volume:/apisix-config
      - ./apisix/apisix.yaml:/host-config/apisix.yaml:rw
    command: >
      sh -c "
        echo '=== Config Sync Service ===' &&
        while true; do
          if [ -f /apisix-config/apisix.yaml ]; then
            echo 'Syncing config from container to host...' &&
            cp /apisix-config/apisix.yaml /host-config/apisix.yaml 2>/dev/null || true
          fi &&
          if [ -f /host-config/apisix.yaml ]; then
            echo 'Syncing config from host to container...' &&
            cp /host-config/apisix.yaml /apisix-config/apisix.yaml 2>/dev/null || true &&
            chmod 666 /apisix-config/apisix.yaml 2>/dev/null || true
          fi &&
          sleep 5
        done
      "
    networks:
      - gateway-net
    depends_on:
      - apisix_api

  apisix-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apisix-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:9080
      - VITE_BACKEND_URL=http://localhost:3000
    depends_on:
      apisix_api:
        condition: service_started
      gofiber-backend:
        condition: service_healthy
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  mariadb_data:
  wordpress_data:
  route_backups:
  apisix_config_volume:  # Shared volume สำหรับ config ระหว่าง APISIX และ GoFiber