version: '3.9'

services:
  apisix_api:
    image: apache/apisix:3.9.1-debian
    container_name: apisix_api
    ports:
      - "9080:9080"
      - "9180:9180"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - apisix_logs:/usr/local/apisix/logs
    environment:
      - APISIX_STAND_ALONE=true
    restart: unless-stopped
    user: root  # ใช้ root เพื่อให้ install packages ได้
    command: >
      sh -c "
        echo '=== APISIX Standalone Setup ===' &&
        echo 'Installing netcat for connectivity tests...' &&
        apt-get update > /dev/null 2>&1 && apt-get install -y netcat-openbsd > /dev/null 2>&1 &&
        echo 'Checking config files...' &&
        ls -la /usr/local/apisix/conf/ &&
        echo 'Config content (first 10 lines):' &&
        head -10 /usr/local/apisix/conf/config.yaml &&
        echo 'Routes content (first 20 lines):' &&
        head -20 /usr/local/apisix/conf/apisix.yaml &&
        echo 'Routes count:' &&
        grep -c 'id:' /usr/local/apisix/conf/apisix.yaml &&
        echo 'Waiting for backends (45s)...' &&
        sleep 45 &&
        echo 'Testing backend connectivity...' &&
        timeout 10 sh -c 'until nc -z gofiber-backend 3000; do echo \"Waiting for GoFiber...\"; sleep 2; done' &&
        timeout 10 sh -c 'until nc -z wordpress 80; do echo \"Waiting for WordPress...\"; sleep 2; done' &&
        echo 'Starting APISIX...' &&
        /usr/bin/apisix init &&
        /usr/bin/apisix start &&
        echo 'APISIX started successfully!' &&
        echo 'Waiting 10 seconds for APISIX to fully load...' &&
        sleep 10 &&
        echo 'Testing APISIX endpoints...' &&
        curl -s -f http://localhost:9080/ && echo 'Root endpoint: OK' || echo 'Root endpoint: FAILED' &&
        curl -s -f http://localhost:9080/api/health && echo 'Health endpoint: OK' || echo 'Health endpoint: FAILED' &&
        echo 'APISIX is ready!' &&
        echo 'Gateway available at: http://localhost:9080' &&
        echo 'Dashboard available at: http://localhost:5173' &&
        echo 'Testing GoFiber backend directly...' &&
        curl -s http://gofiber-backend:3000/api/health | head -1 || echo 'GoFiber direct test failed' &&
        echo 'Monitoring logs...' &&
        tail -f /usr/local/apisix/logs/error.log
      "
    networks:
      - gateway-net
    depends_on:
      wordpress:
        condition: service_healthy
      gofiber-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: apisix_db
      MYSQL_USER: apisix_user
      MYSQL_PASSWORD: apisix_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: apisix_user
      WORDPRESS_DB_PASSWORD: apisix_pass
      WORDPRESS_DB_NAME: apisix_db
      WORDPRESS_TABLE_PREFIX: wp_
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  gofiber-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gofiber-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: apisix_user
      DB_PASSWORD: apisix_pass
      DB_NAME: apisix_db
      PORT: 3000
      ENVIRONMENT: production
      DEBUG: false
      ENABLE_CORS: true
      ROUTE_CONFIG_PATH: /shared/apisix.yaml
    ports:
      - "3000:3000"
    volumes:
      - apisix_config_volume:/shared
      - route_backups:/app/backups
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Enhanced config sync service
  config-sync:
    image: alpine:latest
    container_name: config-sync
    restart: unless-stopped
    volumes:
      - apisix_config_volume:/apisix-config
      - ./apisix/apisix.yaml:/host-config/apisix.yaml:rw
    command: >
      sh -c "
        echo '=== Config Sync Service Started ===' &&
        echo 'Initializing configuration sync...' &&
        
        # Create initial config if not exists
        if [ ! -f /apisix-config/apisix.yaml ]; then
          echo 'Creating initial shared config...' &&
          echo 'routes: []' > /apisix-config/apisix.yaml &&
          echo 'upstreams: []' >> /apisix-config/apisix.yaml &&
          chmod 666 /apisix-config/apisix.yaml
        fi &&
        
        # Copy from host to shared volume initially
        if [ -f /host-config/apisix.yaml ] && [ -s /host-config/apisix.yaml ]; then
          echo 'Copying existing host config to shared volume...' &&
          cp /host-config/apisix.yaml /apisix-config/apisix.yaml &&
          chmod 666 /apisix-config/apisix.yaml
        fi &&
        
        echo 'Starting continuous sync loop...' &&
        while true; do
          # Sync from shared volume to host (for backup/viewing)
          if [ -f /apisix-config/apisix.yaml ]; then
            if [ ! -f /host-config/apisix.yaml ] || [ /apisix-config/apisix.yaml -nt /host-config/apisix.yaml ]; then
              echo 'Syncing config from shared volume to host...' &&
              cp /apisix-config/apisix.yaml /host-config/apisix.yaml 2>/dev/null || true
            fi
          fi &&
          
          # Sync from host to shared volume (for manual edits)
          if [ -f /host-config/apisix.yaml ]; then
            if [ ! -f /apisix-config/apisix.yaml ] || [ /host-config/apisix.yaml -nt /apisix-config/apisix.yaml ]; then
              echo 'Syncing config from host to shared volume...' &&
              cp /host-config/apisix.yaml /apisix-config/apisix.yaml 2>/dev/null || true &&
              chmod 666 /apisix-config/apisix.yaml 2>/dev/null || true
            fi
          fi &&
          
          sleep 10
        done
      "
    networks:
      - gateway-net
    depends_on:
      - gofiber-backend

  apisix-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apisix-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:9080
      - VITE_BACKEND_URL=http://localhost:3000
    depends_on:
      apisix_api:
        condition: service_healthy
      gofiber-backend:
        condition: service_healthy
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  mariadb_data:
  wordpress_data:
  route_backups:
  apisix_config_volume:
  apisix_logs: