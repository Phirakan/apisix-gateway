#
# APISIX Standalone Configuration
# Routes สำหรับ WordPress และ GoFiber APIs
#

routes:
  # WordPress Posts API
  - id: 1
    name: "WordPress Posts API"
    desc: "WordPress REST API for posts"
    uri: "/api/posts"
    methods: 
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "wordpress:80": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      proxy-rewrite:
        regex_uri: 
          - "^/api/posts(.*)"
          - "/wp-json/wp/v2/posts$1"
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400
        expose_headers: "Content-Length,X-Total-Count"

  # WordPress Posts API with ID parameter
  - id: 2
    name: "WordPress Posts by ID"
    desc: "WordPress REST API for specific post"
    uri: "/api/posts/*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "wordpress:80": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/api/posts/(.*)"
          - "/wp-json/wp/v2/posts/$1"
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400
        expose_headers: "Content-Length,X-Total-Count"

  # WordPress API Root - สำหรับ fallback
  - id: 7
    name: "WordPress API Root"
    desc: "WordPress REST API root endpoint"
    uri: "/wp-json/*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "wordpress:80": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400
        expose_headers: "Content-Length,X-Total-Count"

  # GoFiber Health Check
  - id: 3
    name: "GoFiber Health Check"
    desc: "Health check endpoint for GoFiber backend"
    uri: "/api/health"
    methods:
      - GET
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400
        expose_headers: "Content-Length,X-Total-Count"

  # GoFiber Data API - Exact match
  - id: 4
    name: "GoFiber Data API"
    desc: "GoFiber backend data operations"
    uri: "/api/data"
    methods:
      - GET
      - POST
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-API-Key"
        allow_credentials: false
        max_age: 86400
        expose_headers: "Content-Length,X-Total-Count"

  # GoFiber Data API - With parameters
  - id: 5
    name: "GoFiber Data API with ID"
    desc: "GoFiber backend data operations with ID"
    uri: "/api/data/*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-API-Key"
        allow_credentials: false
        max_age: 86400
        expose_headers: "Content-Length,X-Total-Count"

  # Root endpoint - Default route
  - id: 6
    name: "Default GoFiber Route"
    desc: "Default route for GoFiber backend"
    uri: "/"
    methods:
      - GET
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400
        expose_headers: "Content-Length,X-Total-Count"

upstreams:
  - id: 1
    name: "WordPress Upstream"
    desc: "Upstream for WordPress container"
    type: roundrobin
    nodes:
      "wordpress:80": 1
    timeout:
      connect: 6
      send: 6
      read: 6
    
  - id: 2
    name: "GoFiber Upstream"
    desc: "Upstream for GoFiber backend container"
    type: roundrobin
    nodes:
      "gofiber-backend:3000": 1
    timeout:
      connect: 6
      send: 6
      read: 6

#END