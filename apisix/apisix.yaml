#END
# APISIX Routes Configuration - Fixed Version
routes:
  # Route 1: Root endpoint
  - id: 1
    name: "APISIX Root"
    desc: "Root endpoint showing API information"
    uri: "/"
    methods:
      - GET
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_credentials: false
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-API-Key"
        allow_methods: "GET,OPTIONS"
        allow_origins: "*"
        expose_headers: "Content-Length,X-Total-Count"
        max_age: 86400

  # Route 2: GoFiber Health Check
  - id: 2
    name: "GoFiber Health Check"
    desc: "Health check endpoint for GoFiber backend"
    uri: "/api/health"
    methods:
      - GET
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_credentials: false
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-API-Key"
        allow_methods: "GET,OPTIONS"
        allow_origins: "*"
        expose_headers: "Content-Length,X-Total-Count"
        max_age: 86400

  # Route 3: GoFiber Data API
  - id: 3
    name: "GoFiber Data API"
    desc: "GoFiber backend data operations"
    uri: "/api/data"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_credentials: false
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-API-Key"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_origins: "*"
        expose_headers: "Content-Length,X-Total-Count"
        max_age: 86400

  # Route 3b: GoFiber Data API with ID
  - id: 31
    name: "GoFiber Data API with ID"
    desc: "GoFiber backend data operations with ID"
    uri: "/api/data/*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_credentials: false
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-API-Key"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_origins: "*"
        expose_headers: "Content-Length,X-Total-Count"
        max_age: 86400

  # Route 4: WordPress Posts API
  - id: 4
    name: "WordPress Posts API"
    desc: "WordPress REST API for posts"
    uri: "/api/posts"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "wordpress:80": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_credentials: false
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_origins: "*"
        expose_headers: "Content-Length,X-Total-Count"
        max_age: 86400
      proxy-rewrite:
        uri: "/wp-json/wp/v2/posts"

  # Route 4b: WordPress Posts API with ID
  - id: 41
    name: "WordPress Posts API with ID"
    desc: "WordPress REST API for posts with ID"
    uri: "/api/posts/*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "wordpress:80": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_credentials: false
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_origins: "*"
        expose_headers: "Content-Length,X-Total-Count"
        max_age: 86400
      proxy-rewrite:
        regex_uri:
          - "^/api/posts/(.*)"
          - "/wp-json/wp/v2/posts/$1"

  # Route 6: GoFiber Route Management API
  - id: 6
    name: "Route Management API"
    desc: "Dynamic route management endpoints"
    uri: "/api/routes"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_credentials: false
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_origins: "*"
        expose_headers: "Content-Length,X-Total-Count"
        max_age: 86400

  # Route 6b: Route Management API with paths
  - id: 61
    name: "Route Management API Extended"
    desc: "Dynamic route management endpoints with paths"
    uri: "/api/routes/*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_credentials: false
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_origins: "*"
        expose_headers: "Content-Length,X-Total-Count"
        max_age: 86400

upstreams:
  - id: 1
    name: "WordPress Upstream"
    desc: "Upstream for WordPress container"
    type: roundrobin
    nodes:
      "wordpress:80": 1
    timeout:
      connect: 6
      send: 6
      read: 6

  - id: 2
    name: "GoFiber Upstream"
    desc: "Upstream for GoFiber backend container"
    type: roundrobin
    nodes:
      "gofiber-backend:3000": 1
    timeout:
      connect: 6
      send: 6
      read: 6

#END