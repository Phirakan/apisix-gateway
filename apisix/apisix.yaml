routes:
  # WordPress Posts API - แก้ไข regex_uri
  - id: 1
    name: "WordPress Posts API"
    uri: "/api/posts"
    methods: 
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "wordpress:80": 1
    plugins:
      proxy-rewrite:
        uri: "/wp-json/wp/v2/posts"
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400
      response-rewrite:
        headers:
          set:
            Access-Control-Allow-Origin: "*"

  # WordPress Posts API with ID
  - id: 5
    name: "WordPress Posts API with ID"
    uri: "/api/posts/*"
    methods: 
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "wordpress:80": 1
    plugins:
      proxy-rewrite:
        regex_uri: 
          - "^/api/posts(.*)"
          - "/wp-json/wp/v2/posts$1"
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400

  # GoFiber Data API - exact match
  - id: 2
    name: "GoFiber Data API"
    uri: "/api/data"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400

  # GoFiber Data API - wildcard
  - id: 3
    name: "GoFiber Data API Wildcard"
    uri: "/api/data/*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400

  # GoFiber Health Check
  - id: 4
    name: "GoFiber Health Check"
    uri: "/api/health"
    methods:
      - GET
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400

  # WordPress direct access route (for debugging)
  - id: 6
    name: "WordPress Direct"
    uri: "/wp-json/*"
    methods: 
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "wordpress:80": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
        allow_credentials: false
        max_age: 86400

upstreams:
  - id: 1
    name: "WordPress Upstream"
    type: roundrobin
    nodes:
      "wordpress:80": 1
    healthcheck:
      active:
        type: http
        http_path: "/wp-json/wp/v2/posts"
        healthy:
          interval: 3
          successes: 1
        unhealthy:
          interval: 3
          http_failures: 3
    
  - id: 2
    name: "GoFiber Upstream"
    type: roundrobin
    nodes:
      "gofiber-backend:3000": 1
    healthcheck:
      active:
        type: http
        http_path: "/api/health"
        healthy:
          interval: 3
          successes: 1
        unhealthy:
          interval: 3
          http_failures: 3

#END