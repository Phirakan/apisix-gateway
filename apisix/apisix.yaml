routes:
  - id: 1
    name: "WordPress Posts API"
    uri: "/api/posts"
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    upstream:
      type: roundrobin
      nodes:
        "wordpress:80": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/posts(.*)", "/wp-json/wp/v2/posts$1"]
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization"
        allow_credentials: false
        max_age: 86400

  - id: 2
    name: "GoFiber Data API"
    uri: "/api/data/*"
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization"
        allow_credentials: false
        max_age: 86400

  - id: 3
    name: "GoFiber Health Check"
    uri: "/api/health"
    methods: ["GET", "OPTIONS"]
    upstream:
      type: roundrobin
      nodes:
        "gofiber-backend:3000": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Origin,Content-Type,Accept,Authorization"
        allow_credentials: false
        max_age: 86400

upstreams:
  - id: 1
    name: "WordPress Upstream"
    type: roundrobin
    nodes:
      "wordpress:80": 1
    
  - id: 2
    name: "GoFiber Upstream"
    type: roundrobin
    nodes:
      "gofiber-backend:3000": 1