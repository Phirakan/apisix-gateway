# apisix/config.yaml
apisix:
  node_listen: 9080                # Gateway port
  enable_admin: false              # ปิด Admin API ใน standalone mode
  config_center: yaml             # ใช้ YAML config
  extra_lua_path: ""
  extra_lua_cpath: ""
  router:
    http: radixtree_uri           # Router engine
    ssl: radixtree_sni
  
  # Standalone mode configuration
  config_file: "/usr/local/apisix/conf/apisix.yaml"
  
deployment:
  role: data_plane                 # ใช้เป็น data plane
  role_data_plane:
    config_provider: yaml         # โหลด config จาก YAML

# Enable plugins ที่จำเป็น
plugins:
  - public-api
  - cors
  - proxy-rewrite
  - key-auth
  - limit-req
  - limit-count
  - real-ip
  - server-info
  - http-logger

# Nginx configuration
nginx_config:
  error_log: "/tmp/error.log"
  error_log_level: "info"
  worker_processes: "auto"
  worker_rlimit_nofile: 20480
  event:
    worker_connections: 10620
  http:
    access_log: "/tmp/access.log"
    keepalive_timeout: 60s
    client_header_timeout: 60s
    client_body_timeout: 60s
    send_timeout: 10s
    underscores_in_headers: "on"
    real_ip_header: "X-Real-IP"
    real_ip_from:
      - 127.0.0.1
      - 'unix:'