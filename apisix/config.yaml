# apisix/config.yaml
apisix:
  node_listen: 9080
  enable_admin: false
  config_center: yaml
  extra_lua_path: ""
  extra_lua_cpath: ""
  
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

plugins:
  - public-api
  - cors
  - proxy-rewrite
  - key-auth
  - limit-req
  - limit-count