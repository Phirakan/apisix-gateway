# apisix/config.yaml
apisix:
  node_listen: 9080
  enable_admin: false
  config_center: yaml
  extra_lua_path: ""
  extra_lua_cpath: ""
  
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

# เพิ่ม plugins ที่จำเป็น
plugins:
  - public-api
  - cors
  - proxy-rewrite
  - key-auth
  - limit-req
  - limit-count
  - real-ip
  - response-rewrite

plugin_attr:
  # CORS settings
  cors:
    max_age: 86400
    
nginx_config:
  user: root
  worker_processes: auto
  error_log: /usr/local/apisix/logs/error.log warn
  worker_rlimit_nofile: 20480
  
  events:
    accept_mutex: off
    worker_connections: 10620
    
  http:
    access_log: /usr/local/apisix/logs/access.log
    keepalive_timeout: 60s
    keepalive_requests: 1000
    send_timeout: 10s
    
    # เพิ่ม CORS headers ที่ nginx level
    custom_headers:
      - name: Access-Control-Allow-Origin
        value: "*"
        always: true
      - name: Access-Control-Allow-Methods
        value: "GET, POST, PUT, DELETE, OPTIONS"
        always: true
      - name: Access-Control-Allow-Headers
        value: "Origin, Content-Type, Accept, Authorization"
        always: true