apisix:
  node_listen: 9080                
  enable_admin: false         
  config_center: yaml            
  extra_lua_path: ""
  extra_lua_cpath: ""
  
deployment:
  role: data_plane                
  role_data_plane:
    config_provider: yaml         

# Enable plugins ที่จำเป็น
plugins:
  - public-api
  - cors
  - proxy-rewrite
  - key-auth
  - limit-req
  - limit-count
  - real-ip
  - server-info

# Nginx configuration
nginx_config:
  error_log: "/dev/stderr"
  error_log_level: "info"
  worker_processes: "auto"
  worker_rlimit_nofile: 20480
  event:
    worker_connections: 10620
  http:
    access_log: "/dev/stdout"
    keepalive_timeout: 60s
    client_header_timeout: 60s
    client_body_timeout: 60s
    send_timeout: 10s
    underscores_in_headers: "on"
    real_ip_header: "X-Real-IP"
    real_ip_from:
      - 127.0.0.1
      - 'unix:'